# Tests + lint for pull requests and master. No secrets; read-only token.
name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        # Run tests even when lint fails, so one run reports both.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Test cutout mutant runner
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: prototypes/imagine-cutout/tests
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install --no-cache-dir numpy==2.5.4 pillow==13.0.0
          python -m unittest -v test_mutant_run_root_paths test_mutant_src_followups
