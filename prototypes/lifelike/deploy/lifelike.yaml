d\",\n   \"inliers\": 35,\n   \"scale\": 1.039,\n   \"body_err\": 11.1,\n   \"nose_dx\": 52.0,\n   \"flow_p99\": 51.0,\n   \"flow_max\": 54.6\n  },\n  {\n   \"name\": \"yell\",\n   \"kind\": \"mouth\",\n   \"inliers\": 119,\n   \"scale\": 1.008,\n   \"body_err\": 17.6,\n   \"nose_dx\": 1.0,\n   \"flow_p99\": 33.2,\n   \"flow_max\": 40.9,\n   \"mouth\": [\n    218,\n    268,\n    302,\n    344\n   ],\n   \"opening\": [\n    233,\n    281,\n    287,\n    332\n   ]\n  },\n  {\n   \"name\": \"project\",\n   \"kind\": \"mouth\",\n   \"inliers\": 130,\n   \"scale\": 0.974,\n   \"body_err\": 14.8,\n   \"nose_dx\": -1.1,\n   \"flow_p99\": 29.3,\n   \"flow_max\": 34.2,\n   \"mouth\": [\n    210,\n    271,\n    305,\n    337\n   ],\n   \"opening\": [\n    225,\n    284,\n    290,\n    324\n   ]\n  },\n  {\n   \"name\": \"pain\",\n   \"kind\": \"face\",\n   \"inliers\": 79,\n   \"scale\": 1.021,\n   \"body_err\": 11.4,\n   \"nose_dx\": -2.7,\n   \"flow_p99\": 13.2,\n   \"flow_max\": 22.8\n  }\n ],\n \"atlasCols\": 4,\n \"atlasRows\": 4,\n \"flowTile\": 128,\n \"flowScale\": 2.0\n}",
  "gl.js": "// Minimal WebGL1 helpers: context, shader programs, textures, and a CPU-transformed\n// textured-triangle batch (used by all three body approaches so they share one renderer).\n\nexport function createGL(canvas) {\n  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: true, preserveDrawingBuffer: true });\n  if (!gl) throw new Error('WebGL unavailable');\n  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);\n  return gl;\n}\n\nexport function program(gl, vs, fs) {\n  const sh = (type, src) => {\n    const s = gl.createShader(type);\n    gl.shaderSource(s, src);\n    gl.compileShader(s);\n    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));\n    return s;\n  };\n  const p = gl.createProgram();\n  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));\n  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));\n  gl.linkProgram(p);\n  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));\n  const u = {};\n  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);\n  for (let i = 0; i < n; i++) {\n    const info = gl.getActiveUniform(p, i);\n    u[info.name.replace(/\\[0\\]$/, '')] = gl.getUniformLocation(p, info.name);\n  }\n  return { p, u, a: (name) => gl.getAttribLocation(p, name) };\n}\n\nexport function loadImage(url) {\n  return new Promise((resolve, reject) => {\n    const im = new Image();\n    im.onload = () => resolve(im);\n    im.onerror = () => reject(new Error(`failed to load ${url}`));\n    im.src = url;\n  });\n}\n\nexport function texture(gl, img, { premultiply = false, linear = true } = {}) {\n  const t = gl.createTexture();\n  gl.bindTexture(gl.TEXTURE_2D, t);\n  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, premultiply);\n  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);\n  const f = linear ? gl.LINEAR : gl.NEAREST;\n  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);\n  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);\n  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);\n  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);\n  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);\n  return { t, w: img.width, h: img.height };\n}\n\nexport function whiteTexture(gl) {\n  const t = gl.createTexture();\n  gl.bindTexture(gl.TEXTURE_2D, t);\n  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255]));\n  return { t, w: 1, h: 1 };\n}\n\nconst BATCH_VS = `\nattribute vec2 aPos; attribute vec2 aUV;\nuniform vec2 uView; varying vec2 vUV;\nvoid main() { vUV = aUV; gl_Position = vec4(aPos.x / uView.x * 2.0 - 1.0, 1.0 - aPos.y / uView.y * 2.0, 0.0, 1.0); }`;\nconst BATCH_FS = `\nprecision mediump float; varying vec2 vUV; uniform sampler2D uTex; uniform vec4 uTint;\nvoid main() { gl_FragColor = texture2D(uTex, vUV) * uTint; }`;\n\n// Immediate-mode batch: push triangles (screen px + texture px) for one texture, flush.\nexport class Batch {\n  constructor(gl) {\n    this.gl = gl;\n    this.prog = program(gl, BATCH_VS, BATCH_FS);\n    this.buf = gl.createBuffer();\n    this.data = new Float32Array(4 * 6 * 4096);\n    this.n = 0;\n    this.white = whiteTexture(gl);\n  }\n  begin(w, h) {\n    const gl = this.gl;\n    gl.viewport(0, 0, w, h);\n    this.view = [w, h];\n    gl.enable(gl.BLEND);\n    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);\n  }\n  tri(x0, y0, u0, v0, x1, y1, u1, v1, x2, y2, u2, v2) {\n    const d = this.data;\n    let i = this.n * 4;\n    d[i++] = x0; d[i++] = y0; d[i++] = u0; d[i++] = v0;\n    d[i++] = x1; d[i++] = y1; d[i++] = u1; d[i++] = v1;\n    d[i++] = x2; d[i++] = y2; d[i++] = u2; d[i++] = v2;\n    this.n += 3;\n  }\n  // quad from 4 screen corners (tl, tr, br, bl) and a texture rect in px\n  quad(c, rect) {\n    const [rx, ry, rw, rh] = rect;\n    this.tri(c[0], c[1], rx, ry, c[2], c[3], rx + rw, ry, c[4], c[5], rx + rw, ry + rh);\n    this.tri(c[0], c[1], rx, ry, c[4], c[5], rx + rw, ry + rh, c[6], c[7], rx, ry + rh);\n  }\n  flush(tex, tint = [1, 1, 1, 1], mode) {\n    if (!this.n) return;\n    const gl = this.gl;\n    const { p, u, a } = this.prog;\n    gl.useProgram(p);\n    const d = this.data;\n    const sx = 1 / tex.w, sy = 1 / tex.h;\n    for (let i = 0; i < this.n; i++) {\n      d[i * 4 + 2] *= sx;\n      d[i * 4 + 3] *= sy;\n    }\n    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);\n    gl.bufferData(gl.ARRAY_BUFFER, d.subarray(0, this.n * 4), gl.STREAM_DRAW);\n    const ap = a('aPos'), au = a('aUV');\n    gl.enableVertexAttribArray(ap);\n    gl.enableVertexAttribArray(au);\n    gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 16, 0);\n    gl.vertexAttribPointer(au, 2, gl.FLOAT, false, 16, 8);\n    gl.uniform2f(u.uView, this.view[0], this.view[1]);\n    gl.uniform4f(u.uTint, tint[0] * tint[3], tint[1] * tint[3], tint[2] * tint[3], tint[3]);\n    gl.activeTexture(gl.TEXTURE0);\n    gl.bindTexture(gl.TEXTURE_2D, tex.t);\n    gl.uniform1i(u.uTex, 0);\n    gl.drawArrays(mode ?? gl.TRIANGLES, 0, this.n);\n    this.n = 0;\n  }\n  // debug lines (pairs of points), solid colour\n  lines(pts, color) {\n    for (let i = 0; i + 3 < pts.length; i += 4) {\n      const d = this.data;\n      let j = this.n * 4;\n      d[j++] = pts[i]; d[j++] = pts[i + 1]; d[j++] = 0; d[j++] = 0;\n      d[j++] = pts[i + 2]; d[j++] = pts[i + 3]; d[j++] = 0; d[j++] = 0;\n      this.n += 2;\n    }\n    this.flush(this.white, color, this.gl.LINES);\n  }\n}\n",
  "index.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"icon\" href=\"data:,\">\n<title>Lifelike AI art, animated: three ways</title>\n<style>\n  body { margin: 0; background: #0c0d10; color: #d8dbe2; font: 14px/1.45 system-ui, sans-serif; }\n  main { max-width: 1240px; margin: 0 auto; padding: 18px; }\n  h1 { font-size: 20px; margin: 0 0 4px; }\n  h2 { font-size: 16px; margin: 22px 0 6px; }\n  p { margin: 4px 0; color: #a9aebb; max-width: 1100px; }\n  .stage { position: relative; display: inline-block; background: #17191e; border-radius: 6px; }\n  .labels { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 13px; }\n  .labels div { padding: 6px 10px; border-bottom: 1px solid #262a31; }\n  .labels b { color: #fff; }\n  .sliders label { margin-left: 4px; }\n  .sliders input[type=range] { width: 110px; vertical-align: middle; }\n  select { background: #22262e; color: #d8dbe2; border: 1px solid #343a45; }\n  .labels span { color: #8f95a3; display: block; font-size: 12px; }\n  canvas { display: block; }\n  .bar { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }\n  button { background: #22262e; color: #d8dbe2; border: 1px solid #343a45; border-radius: 4px; padding: 4px 10px; cursor: pointer; }\n  button.on { background: #3b6df0; border-color: #3b6df0; color: #fff; }\n  label { margin-left: 10px; color: #a9aebb; }\n  #exprNow { margin-left: 10px; color: #ffd27a; }\n  table { border-collapse: collapse; margin-top: 6px; font-size: 13px; }\n  td, th { border: 1px solid #2a2e36; padding: 4px 8px; text-align: left; }\n  th { background: #191c22; }\n  a { color: #8fb0ff; }\n</style>\n</head>\n<body>\n<main>\n  <h1>Lifelike AI art, animated: three ways</h1>\n  <p>All three methods use the same AI-generated, fictional character. The body is one side-view image cut into parts. The face is one portrait, plus AI-made expression and eyes-closed versions of it. Everything renders live in WebGL. Turn on <i>debug</i> to see the bones, the mesh and the masks.</p>\n\n  <h2>Body: gameplay sprite</h2>\n  <div class=\"bar\">\n    <button data-gait=\"idle\">idle</button><button data-gait=\"walk\">walk</button><button data-gait=\"run\">run</button>\n    <label><input type=\"checkbox\" id=\"debug\"> debug (bones / mesh / masks)</label>\n    <label><input type=\"checkbox\" id=\"blendC\"> C: crossfade between frames</label>\n  </div>\n  <div class=\"stage\" id=\"bodyStage\">\n    <div class=\"labels\">\n      <div><b>A. Cutout parts on a skeleton</b><span>Rigid pieces rotate at the joints, with painted fills where the arm hid the jacket</span></div>\n      <div><b>B. Skinned mesh (Live2D-style)</b><span>Whole-limb textures bend at the joints, plus breathing and hair sway</span></div>\n      <div><b>C. AI-generated frames</b><span>6 walk poses from a second AI image, played as a flipbook</span></div>\n    </div>\n    <canvas id=\"body\" width=\"1200\" height=\"440\"></canvas>\n  </div>\n\n  <h2>Face: the expression \"gambit\" (flow morph)</h2>\n  <p>One AI portrait plus 10 AI versions of the same character: happy, angry, sad, surprised, distressed, winded, yelling, projecting and pain. The versions are aligned and morphed with optical flow. Blinks, eye movement and breathing are procedural. F2 (flow morph) is the default; F1, F3 and F4 stay selectable in the view menu. Distracted is eyes only: the gaze wanders around the room while the head keeps its idle sway. The head-turn versions were rejected and are only in the \"rejected\" view.</p>\n  <div class=\"bar\">\n    <button data-expr=\"auto\">gambit reel</button>\n    <button data-expr=\"neutral\">neutral</button><button data-expr=\"happy\">happy</button><button data-expr=\"angry\">angry</button>\n    <button data-expr=\"sad\">sad</button><button data-expr=\"surprised\">surprised</button><button data-expr=\"distressed\">distressed</button>\n    <span id=\"exprNow\"></span>\n  </div>\n  <div class=\"bar sliders\">\n    <b>blend</b>\n    <label>happy <input type=\"range\" data-w=\"happy\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n    <label>angry <input type=\"range\" data-w=\"angry\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n    <label>sad <input type=\"range\" data-w=\"sad\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n    <label>surprised <input type=\"range\" data-w=\"surprised\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n    <label>distressed <input type=\"range\" data-w=\"distressed\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n  </div>\n  <div class=\"bar sliders\">\n    <b>behaviour</b>\n    <label>breathing: calm <input type=\"range\" id=\"breath\" min=\"0\" max=\"1\" step=\"0.05\"> winded</label>\n    <label>distracted <input type=\"range\" id=\"distract\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n    <button data-glance=\"-1\">glance left</button><button data-glance=\"1\">glance right</button>\n    <label><input type=\"checkbox\" id=\"takes\" checked> squint take before surprise</label>\n  </div>\n  <div class=\"bar sliders\">\n    <b>speech</b>\n    <button data-speech=\"off\">quiet</button><button data-speech=\"talk\">talking</button><button data-speech=\"yell\">angry yelling</button>\n    <button data-speech=\"project\">projecting (noisy room)</button><button data-speech=\"interject\">interject</button>\n    <label>volume <input type=\"range\" id=\"volume\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n    <label><input type=\"checkbox\" id=\"talk\"> talk</label>\n  </div>\n  <div class=\"bar sliders\">\n    <b>pain</b>\n    <button data-hit=\"0.35\">hit: light</button><button data-hit=\"0.7\">hit: medium</button><button data-hit=\"1\">hit: heavy</button>\n    <label>hurting <input type=\"range\" id=\"hurt\" min=\"0\" max=\"1\" step=\"0.05\"></label>\n  </div>\n  <div class=\"bar\">\n    <b>presets</b>\n    <button data-preset=\"distressed+winded\">distressed + winded</button><button data-preset=\"happy+distracted\">happy + distracted</button>\n    <button data-preset=\"sad+surprised\">sad + surprised</button><button data-preset=\"angry+winded\">angry + winded</button>\n    <label>view <select id=\"view\"></select></label>\n    <label>morph <select id=\"fix\"><option value=\"0\">v1 (lips double)</option><option value=\"1\">fixed flow</option><option value=\"2\">fixed + short mouth dissolve</option></select></label>\n  </div>\n  <p>The same face as a small embeddable module with an event API: <a href=\"bust.html\">bust widget</a> (<code>bust.js</code>).</p>\n  <div class=\"stage\" id=\"faceStage\">\n    <div class=\"labels\">\n      <div><b>P</b><span></span></div>\n      <div><b>Q</b><span></span></div>\n      <div><b>R</b><span></span></div>\n    </div>\n    <canvas id=\"face\" width=\"1200\" height=\"400\"></canvas>\n  </div>\n\n  <h2>What to look for</h2>\n  <table>\n    <tr><th></th><th>Works</th><th>Breaks</th></tr>\n    <tr><td>A cutout</td><td>Cheap, stays sharp, fully controllable, any number of moves</td><td>Lighting baked into the pixels rotates with each piece. Seams at the knees and elbows. Hidden areas had to be painted in, and the torso fill repeats the pocket</td></tr>\n    <tr><td>B mesh</td><td>Smooth joints, breathing and hair sway. Feels the most alive</td><td>The texture stretches and pinches at the knees (the \"candy-wrapper\" twist), and a photo-real knee bends like rubber</td></tr>\n    <tr><td>C AI frames</td><td>Real cloth folds and weight in every frame</td><td>Only 6 frames, a 10% head bob, the size drifts between frames, the near/far leg is ambiguous, there is no idle or run, and each new move needs another AI batch</td></tr>\n    <tr><td>F1-F4 face</td><td>F1 = hand-built warp rig, F2 = flow morph between AI versions, F3 = plain crossfade, F4 = F2 for the expression plus a flow-driven mouth warp for speech with the real teeth/tongue switched in. F2 is the default (user verdict: F2 wins most, F4 fails quite a bit)</td><td>F2 ghosts teeth and tongue when talking; F3 doubles everything mid-change; F1 cannot make new wrinkles</td></tr>\n    <tr><td>Face morph</td><td>Real wrinkles, teeth and flush come from the AI versions. Expressions blend by region: brows from one, mouth from another</td><td>Hair differs between the AI versions, so it is masked out of expressions. Head turns have to include the hair, and it changes texture as she turns</td></tr>\n  </table>\n</main>\n<script type=\"module\" src=\"main.js\"></script>\n</body>\n</html>\n",
  "main.js": "import { Batch, createGL, loadImage, texture } from './gl.js';\nimport { GAITS, Rig, buildMeshes, drawCutout, drawFlipbook, drawMeshes, gaitSpeed } from './rig.js';\nimport { EXPRS, FaceRenderer, FaceSim, METHODS, TURN_MODES, VIEWS } from './face.js';\n\nconst DT = 1 / 60;\nconst q = new URLSearchParams(location.search);\nconst settings = { paused: false, debug: q.get('debug') === '1', gait: q.get('gait') || 'walk', blendC: q.get('blend') === '1', fix: Number(q.get('fix') ?? 2), view: VIEWS[q.get('view')] ? q.get('view') : 'f2' };\n\nconst bodyCanvas = document.getElementById('body');\nconst faceCanvas = document.getElementById('face');\nconst bgl = createGL(bodyCanvas);\nconst fgl = createGL(faceCanvas);\n\nconst [atlasImg, rigJson, walkImg, walkMeta, fN, fC, fE, fF, faceMeta] = await Promise.all([\n  loadImage('body-atlas.webp'), fetch('body-rig.json').then((r) => r.json()),\n  loadImage('walk-frames.webp'), fetch('walk-frames.json').then((r) => r.json()),\n  loadImage('face-n.webp'), loadImage('face-c.webp'), loadImage('face-e.webp'), loadImage('face-f.webp'),\n  fetch('face.json').then((r) => r.json()),\n]);\nconst batch = new Batch(bgl);\nconst atlas = texture(bgl, atlasImg, { premultiply: true });\nconst walkTex = texture(bgl, walkImg, { premultiply: true });\nconst rig = new Rig(rigJson);\nconst meshes = buildMeshes(rig);\nconst face = new FaceRenderer(fgl, {\n  uN: texture(fgl, fN), uC: texture(fgl, fC), uE: texture(fgl, fE), uF: texture(fgl, fF, { linear: true }),\n}, faceMeta);\nconst faceSim = new FaceSim();\nfaceSim.eyesOnly = !VIEWS[settings.view].headTurn;\n\n// --- simulation state (deterministic, stepped at 60 Hz)\nconst sim = { t: 0, ticks: 0, phase: 0, scroll: 0, gaitK: settings.gait === 'idle' ? 0 : 1, cur: settings.gait === 'idle' ? 'walk' : settings.gait, frameC: 0, scrollC: 0 };\nconst PANEL_W = 400, SCALE = 0.6, GROUND = rigJson.ground;\n// C calibration: AI frame cell px -> model px (figure height match) and its own stride\nconst C_K = (GROUND - 22) / 367;\nconst C_CYCLE_PX = 240 * C_K; // 6 frames = two steps of ~120 cell px\nconst C_CYCLE_T = 1.0;\n\nfunction step() {\n  const target = settings.gait === 'idle' ? 0 : 1;\n  sim.gaitK += Math.sign(target - sim.gaitK) * Math.min(Math.abs(target - sim.gaitK), DT / 0.35);\n  if (settings.gait !== 'idle') sim.cur = settings.gait;\n  const g = GAITS[sim.cur];\n  sim.phase = (sim.phase + (DT / g.T) * (sim.gaitK > 0 ? 1 : 0)) % 1;\n  sim.scroll += gaitSpeed(g) * DT * sim.gaitK;\n  const cRate = settings.gait === 'run' ? 2 : 1;\n  if (settings.gait !== 'idle') {\n    sim.frameC = (sim.frameC + (DT / C_CYCLE_T) * walkMeta.n * cRate) % walkMeta.n;\n    sim.scrollC += (C_CYCLE_PX / C_CYCLE_T) * cRate * DT;\n  }\n  faceSim.step(DT);\n  sim.t += DT;\n  sim.ticks++;\n}\n\nfunction ground(px, scroll, w) {\n  const y = 36 + GROUND * SCALE;\n  const pts = [px, y, px + w, y];\n  const sp = 60;\n  const off = (scroll * SCALE) % sp;\n  for (let x = -off; x < w; x += sp) if (x >= 0) pts.push(px + x, y, px + x - 10, y + 12);\n  batch.lines(pts, [0.55, 0.6, 0.68, 1]);\n}\n\nconst TINTS = { near: [1, 1, 1, 1], far: [0.62, 0.62, 0.66, 1], farLeg: [0.8, 0.8, 0.82, 1] };\n\nfunction drawBody() {\n  const W = bodyCanvas.width, H = bodyCanvas.height;\n  bgl.clearColor(0.09, 0.1, 0.12, 1);\n  bgl.clear(bgl.COLOR_BUFFER_BIT);\n  batch.begin(W, H);\n  const g = GAITS[sim.cur];\n  const pose = Rig.blend(rig.idlePose(sim.t), rig.gaitPose(g, sim.phase, sim.t), sim.gaitK);\n  const M = rig.matrices(pose);\n  const cx = 175;\n  for (let i = 0; i < 3; i++) {\n    const view = { x: i * PANEL_W + PANEL_W / 2 - cx * SCALE, y: 36, s: SCALE };\n    if (i === 0) drawCutout(batch, atlas, rig, M, view, TINTS, settings.debug);\n    if (i === 1) drawMeshes(batch, atlas, rig, meshes, M, pose, view, TINTS, settings.debug);\n    if (i === 2) {\n      const idle = settings.gait === 'idle';\n      drawFlipbook(batch, walkTex, walkMeta, idle ? 0 : sim.frameC, view, {\n        k: C_K, cx: cx + 10, ground: GROUND + 4, blend: settings.blendC, debug: settings.debug,\n        squash: idle ? 1 + 0.006 * Math.sin((sim.t * Math.PI * 2) / 3.6) : 1,\n      });\n    }\n    ground(i * PANEL_W + 20, i === 2 ? sim.scrollC : sim.scroll, PANEL_W - 40);\n    if (i) batch.lines([i * PANEL_W, 0, i * PANEL_W, H], [0.25, 0.27, 0.3, 1]);\n  }\n}\n\nfunction drawFace() {\n  const W = faceCanvas.width;\n  fgl.clearColor(0.09, 0.1, 0.12, 1);\n  fgl.clear(fgl.COLOR_BUFFER_BIT);\n  faceSim.eyesOnly = !VIEWS[settings.view].headTurn;   // kept in sync every frame (reset() restores the default)\n  const s = faceSim.state();\n  const size = W / 3;\n  VIEWS[settings.view].panels.forEach(([meth, tm], m) => face.draw(meth, tm, s, [m * size + 4, 4, size - 8, size - 8], settings.debug, settings.fix));\n  document.getElementById('exprNow').textContent = describe(s);\n}\nfunction describe(s) {\n  if (faceSim.script) return faceSim.label;\n  const on = EXPRS.filter((e) => faceSim.cur[e] > 0.15).map((e) => `${e} ${faceSim.cur[e].toFixed(1)}`);\n  if (faceSim.breathI > 0.05) on.push(`breath ${faceSim.breathI.toFixed(2)}`);\n  if (faceSim.d.mode !== 'present') on.push(`glance ${faceSim.d.side < 0 ? 'left' : 'right'}`);\n  if (s.pain > 0.05) on.push(`pain ${s.pain.toFixed(2)}`);\n  if (faceSim.hurtC > 0.05) on.push(`hurting ${faceSim.hurtC.toFixed(2)}`);\n  if (faceSim.speech !== 'off') on.push(`${faceSim.speech} (${s.talk.toFixed(2)})`);\n  return on.join(' + ') || 'neutral';\n}\n\nfunction draw() {\n  drawBody();\n  drawFace();\n}\n\nlet last = performance.now(), acc = 0;\nfunction loop(now) {\n  if (!settings.paused) {\n    acc += Math.min(0.1, (now - last) / 1000);\n    while (acc >= DT) {\n      step();\n      acc -= DT;\n    }\n    draw();\n  }\n  last = now;\n  requestAnimationFrame(loop);\n}\ndraw();\nrequestAnimationFrame(loop);\n\n// --- UI\nfor (const b of document.querySelectorAll('[data-gait]')) {\n  b.addEventListener('click', () => {\n    settings.gait = b.dataset.gait;\n    syncUI();\n  });\n}\nconst $ = (id) => document.getElementById(id);\nconst PRESETS = {\n  'distressed+winded': () => { faceSim.setBlend({ distressed: 1 }); faceSim.setBreath(1, 1.5); },\n  'happy+distracted': () => { faceSim.setBlend({ happy: 1 }); faceSim.distract = 0.8; },\n  'sad+surprised': () => faceSim.setBlend({ sad: 0.6, surprised: 0.5 }),\n  'angry+winded': () => { faceSim.setBlend({ angry: 0.8 }); faceSim.setBreath(0.8, 1.5); },\n};\nfunction manual() {\n  faceSim.script = false;\n  faceSim.label = '';\n}\nfor (const b of document.querySelectorAll('[data-expr]')) {\n  b.addEventListener('click', () => {\n    if (b.dataset.expr === 'auto') {\n      faceSim.reset();\n      faceSim.takes = $('takes').checked;\n    } else {\n      manual();\n      faceSim.setExpr(b.dataset.expr);\n    }\n    syncUI();\n  });\n}\nfor (const b of document.querySelectorAll('[data-preset]')) {\n  b.addEventListener('click', () => {\n    manual();\n    faceSim.distract = 0;\n    faceSim.setBreath(0, 1.5);\n    PRESETS[b.dataset.preset]();\n    syncUI();\n  });\n}\nfor (const r of document.querySelectorAll('[data-w]')) {\n  r.addEventListener('input', () => {\n    manual();\n    faceSim.target[r.dataset.w] = Number(r.value);\n    syncUI();\n  });\n}\n$('breath').addEventListener('input', (e) => {\n  manual();\n  faceSim.setBreath(Number(e.target.value), 0.8);\n  syncUI();\n});\n$('distract').addEventListener('input', (e) => {\n  manual();\n  faceSim.distract = Number(e.target.value);\n  syncUI();\n});\nfor (const b of document.querySelectorAll('[data-glance]')) {\n  b.addEventListener('click', () => {\n    manual();\n    faceSim.glance(Number(b.dataset.glance), 1.4);\n  });\n}\n$('talk').addEventListener('change', (e) => {\n  faceSim.talk = e.target.checked;\n});\nfor (const b of document.querySelectorAll('[data-speech]')) {\n  b.addEventListener('click', () => {\n    manual();\n    faceSim.setSpeech(b.dataset.speech);\n    syncUI();\n  });\n}\nfor (const b of document.querySelectorAll('[data-hit]')) {\n  b.addEventListener('click', () => {\n    manual();\n    faceSim.hit(Number(b.dataset.hit));\n  });\n}\n$('hurt').addEventListener('input', (e) => {\n  manual();\n  faceSim.setHurt(Number(e.target.value));\n});\n$('volume').addEventListener('input', (e) => {\n  faceSim.volume = Number(e.target.value);\n});\n$('view').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<option value=\"${k}\">${v.name}</option>`).join('');\n$('view').addEventListener('change', (e) => {\n  settings.view = e.target.value;\n  faceSim.eyesOnly = !VIEWS[settings.view].headTurn;\n  labels();\n});\nfunction labels() {\n  const ps = VIEWS[settings.view].panels;\n  for (const [i, el] of document.querySelectorAll('#faceStage .labels > div').entries()) {\n    const [meth, tm] = ps[i];\n    el.querySelector('b').textContent = `${'PQR'[i]}. ${METHODS[meth]}`;\n    el.querySelector('span').textContent = meth === 1 ? 'hand-built warp rig, no turned art' : TURN_MODES[tm];\n  }\n}\n$('takes').addEventListener('change', (e) => {\n  faceSim.takes = e.target.checked;\n});\n$('fix').addEventListener('change', (e) => {\n  settings.fix = Number(e.target.value);\n});\n$('debug').addEventListener('change', (e) => {\n  settings.debug = e.target.checked;\n});\n$('blendC').addEventListener('change', (e) => {\n  settings.blendC = e.target.checked;\n});\nfunction syncUI() {\n  for (const b of document.querySelectorAll('[data-gait]')) b.classList.toggle('on', b.dataset.gait === settings.gait);\n  const tg = faceSim.target, top = EXPRS.find((e) => tg[e] === 1 && EXPRS.every((x) => x === e || !tg[x]));\n  const neutral = EXPRS.every((e) => !tg[e]);\n  for (const b of document.querySelectorAll('[data-expr]')) {\n    const ex = b.dataset.expr;\n    b.classList.toggle('on', ex === 'auto' ? faceSim.script : !faceSim.script && (ex === 'neutral' ? neutral : ex === top));\n  }\n  for (const r of document.querySelectorAll('[data-w]')) r.value = tg[r.dataset.w];\n  $('breath').value = faceSim.breathT;\n  $('distract').value = faceSim.distract;\n  $('talk').checked = faceSim.talk;\n  $('volume').value = faceSim.volume;\n  $('hurt').value = faceSim.hurt;\n  $('view').value = settings.view;\n  for (const b of document.querySelectorAll('[data-speech]')) b.classList.toggle('on', faceSim.speech === b.dataset.speech);\n  $('takes').checked = faceSim.takes;\n  $('fix').value = String(settings.fix);\n  $('debug').checked = settings.debug;\n  $('blendC').checked = settings.blendC;\n}\nsyncUI();\nlabels();\n\n// --- deterministic test API (used by scripts/shots.mjs)\nwindow.lifelike = {\n  settings, sim,\n  advance(n = 1) {\n    for (let i = 0; i < n; i++) step();\n    draw();\n  },\n  reset(gait = 'walk') {\n    Object.assign(sim, { t: 0, ticks: 0, phase: 0, scroll: 0, frameC: 0, scrollC: 0, gaitK: gait === 'idle' ? 0 : 1, cur: gait === 'idle' ? 'walk' : gait });\n    settings.gait = gait;\n    faceSim.reset();\n    syncUI();\n    draw();\n  },\n  face: faceSim,\n  // expr: null = gambit script; a name = that expression; an object = a blend of targets\n  setFace(expr, opts = {}) {\n    if (expr === null) {\n      faceSim.reset();\n    } else {\n      manual();\n      if (typeof expr === 'string') faceSim.setExpr(expr);\n      else faceSim.setBlend(expr);\n    }\n    if (opts.breath !== undefined) faceSim.setBreath(opts.breath, opts.ramp ?? 0.8);\n    if (opts.distract !== undefined) faceSim.distract = opts.distract;\n    if (opts.talk !== undefined) faceSim.talk = opts.talk;\n    if (opts.speech !== undefined) faceSim.setSpeech(opts.speech);\n    if (opts.hit !== undefined) faceSim.hit(opts.hit, opts.side ?? 1);\n    if (opts.hurt !== undefined) faceSim.setHurt(opts.hurt);\n    if (opts.volume !== undefined) faceSim.volume = opts.volume;\n    if (opts.view !== undefined) {\n      settings.view = opts.view;\n      faceSim.eyesOnly = !VIEWS[settings.view].headTurn;\n      labels();\n    }\n    if (opts.glance) faceSim.glance(opts.glance[0], opts.glance[1]);\n    if (opts.fix !== undefined) settings.fix = opts.fix;\n    syncUI();\n    draw();\n  },\n  draw,\n};\n",
  "rig.js": "// Skeleton, procedural gait (2-bone IK on a treadmill) and the three body renderers:\n//   A = rigid cutout parts on bones, B = skinned grid meshes over whole-limb textures,\n//   C = flipbook of AI-generated walk frames.\n// Model space = rest-pose pixels of the AI side view at atlas scale (360 x 640).\n\nconst TAU = Math.PI * 2;\nconst clamp = (v, a, b) => Math.min(b, Math.max(a, v));\nconst smooth = (a, b, x) => {\n  const t = clamp((x - a) / (b - a), 0, 1);\n  return t * t * (3 - 2 * t);\n};\nconst lerp = (a, b, t) => a + (b - a) * t;\n\n// --- 2D affine matrices [a, b, c, d, e, f]: x' = a x + c y + e, y' = b x + d y + f\nconst mul = (m, n) => [\n  m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],\n  m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],\n  m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5],\n];\nconst rotAbout = (px, py, ang) => {\n  const c = Math.cos(ang), s = Math.sin(ang);\n  return [c, s, -s, c, px - c * px + s * py, py - s * px - c * py];\n};\nconst trans = (x, y) => [1, 0, 0, 1, x, y];\nconst apply = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];\n\n// bone -> parent, pivot (from body-rig.json joints)\nconst HIER = {\n  root: null, torso: 'root', head: 'torso', armU: 'torso', armL: 'armU',\n  farArmU: 'torso', farArmL: 'farArmU',\n  thighN: 'root', shinN: 'thighN', footN: 'shinN', thighF: 'root', shinF: 'thighF', footF: 'shinF',\n};\nconst FAR_ARM_OFFSET = [16, -3];\n\nexport class Rig {\n  constructor(rig) {\n    this.rig = rig;\n    const J = rig.joints;\n    this.J = { ...J, root: J.thighN, farArmU: J.armU, farArmL: J.armL };\n    const len = (a, b) => Math.hypot(J[b][0] - J[a][0], J[b][1] - J[a][1]);\n    const ang = (a, b) => Math.atan2(J[b][1] - J[a][1], J[b][0] - J[a][0]);\n    this.legs = {\n      N: { hip: J.thighN, l1: len('thighN', 'shinN'), l2: len('shinN', 'footN'), a1: ang('thighN', 'shinN'), a2: ang('shinN', 'footN'), ground: J.footN[1] },\n      F: { hip: J.thighF, l1: len('thighF', 'shinF'), l2: len('shinF', 'footF'), a1: ang('thighF', 'shinF'), a2: ang('shinF', 'footF'), ground: J.footF[1] },\n    };\n    this.ankleX = { N: J.footN[0], F: J.footF[0] };\n  }\n\n  // gait: {name, T, stance, L, lift, drop} ; returns pose = {angles, root:[dx,dy], breath, sway}\n  gaitPose(g, phase, t) {\n    const a = {};\n    const hipDy = g.name === 'run'\n      ? g.drop * Math.cos(TAU * 2 * (phase - g.stance / 2)) // low at mid-stance, high in flight\n      : g.drop * (0.5 + 0.5 * Math.cos(TAU * 2 * phase)); // low at double support\n    for (const side of ['N', 'F']) {\n      const leg = this.legs[side];\n      const ph = (phase + (side === 'F' ? 0.5 : 0)) % 1;\n      let x, y, footAng;\n      if (ph < g.stance) {\n        const u = ph / g.stance;\n        x = this.ankleX[side] + g.L - 2 * g.L * u;\n        y = leg.ground;\n        footAng = 0.55 * smooth(0.7, 1, u); // heel-off\n        y -= 10 * smooth(0.7, 1, u);\n      } else {\n        const u = (ph - g.stance) / (1 - g.stance);\n        x = this.ankleX[side] - g.L + 2 * g.L * smooth(0, 1, u);\n        y = leg.ground - g.lift * Math.sin(Math.PI * Math.pow(u, 0.8));\n        footAng = lerp(0.55, -0.2, smooth(0, 0.8, u));\n      }\n      const hx = leg.hip[0], hy = leg.hip[1] + hipDy;\n      let dx = x - hx, dy = y - hy;\n      let d = Math.hypot(dx, dy);\n      const maxD = leg.l1 + leg.l2 - 0.5;\n      if (d > maxD) {\n        dx *= maxD / d;\n        dy *= maxD / d;\n        d = maxD;\n      }\n      const base = Math.atan2(dy, dx);\n      const cosA = clamp((leg.l1 * leg.l1 + d * d - leg.l2 * leg.l2) / (2 * leg.l1 * d), -1, 1);\n      const thighAbs = base - Math.acos(cosA); // knee bends forward (+x)\n      const kx = hx + leg.l1 * Math.cos(thighAbs), ky = hy + leg.l1 * Math.sin(thighAbs);\n      const shinAbs = Math.atan2(hy + dy - ky, hx + dx - kx);\n      a[`thigh${side}`] = thighAbs - leg.a1;\n      a[`shin${side}`] = shinAbs - leg.a2 - (thighAbs - leg.a1);\n      a[`foot${side}`] = footAng - (shinAbs - leg.a2);\n    }\n    const sw = Math.cos(TAU * phase);\n    const runK = g.name === 'run' ? 1 : 0;\n    a.armU = g.arm * sw;\n    a.armL = -(0.2 + 0.25 * Math.max(0, -sw)) - runK * 1.2;\n    a.farArmU = -g.arm * sw;\n    a.farArmL = -(0.2 + 0.25 * Math.max(0, sw)) - runK * 1.2;\n    a.torso = g.lean + 0.02 * Math.cos(TAU * 2 * phase);\n    a.head = -g.lean * 0.6 - 0.015 * Math.cos(TAU * 2 * phase);\n    a.root = 0;\n    return { a, root: [0, hipDy], breath: 0.5 + 0.5 * Math.sin(t * TAU / 2.2), sway: 0.6 * Math.sin(TAU * 2 * phase + 1) };\n  }\n\n  idlePose(t) {\n    const b = Math.sin((t * TAU) / 3.6);\n    const a = {\n      root: 0, torso: 0.012 * b, head: -0.01 * b + 0.02 * Math.sin(t * 0.7),\n      armU: 0.03 * b + 0.02, armL: -0.05 - 0.02 * b, farArmU: -0.01 * b, farArmL: -0.08,\n    };\n    for (const k of ['thighN', 'shinN', 'footN', 'thighF', 'shinF', 'footF']) a[k] = 0;\n    // keep feet planted while the hips settle a little: small knee flex\n    const flex = 0.03 + 0.02 * b;\n    a.thighN = -flex; a.shinN = 2 * flex; a.footN = -flex;\n    a.thighF = -flex; a.shinF = 2 * flex; a.footF = -flex;\n    return { a, root: [0, 1.2 + 1.2 * b], breath: 0.5 + 0.5 * b, sway: 0.4 * Math.sin(t * 1.3) };\n  }\n\n  static blend(p, q, k) {\n    const a = {};\n    for (const n of Object.keys(p.a)) a[n] = lerp(p.a[n], q.a[n], k);\n    return { a, root: [lerp(p.root[0], q.root[0], k), lerp(p.root[1], q.root[1], k)], breath: lerp(p.breath, q.breath, k), sway: lerp(p.sway, q.sway, k) };\n  }\n\n  // world matrices (model space) for every bone\n  matrices(pose) {\n    const M = {};\n    const get = (name) => {\n      if (M[name]) return M[name];\n      const parent = HIER[name];\n      const [px, py] = this.J[name];\n      let local = rotAbout(px, py, pose.a[name] || 0);\n      if (name === 'root') local = mul(trans(pose.root[0], pose.root[1]), local);\n      if (name === 'farArmU') local = mul(trans(FAR_ARM_OFFSET[0], FAR_ARM_OFFSET[1]), local);\n      M[name] = parent ? mul(get(parent), local) : local;\n      return M[name];\n    };\n    for (const n of Object.keys(HIER)) get(n);\n    return M;\n  }\n}\n\n// ---------------------------------------------------------------- A: rigid cutout\nconst A_ORDER = [\n  ['farArmL', 'armL', 'far'], ['farArmU', 'armU', 'far'],\n  ['footF', 'footF', 'farLeg'], ['shinF', 'shinF', 'farLeg'], ['thighF', 'thighF', 'farLeg'],\n  ['footN', 'footN'], ['shinN', 'shinN'], ['thighN', 'thighN'],\n  ['torso', 'torso'], ['head', 'head'],\n  ['armL', 'armL'], ['armU', 'armU'],\n];\n\nexport function drawCutout(batch, tex, rig, M, view, tints, debug) {\n  const P = rig.rig.parts;\n  let curTint = null;\n  for (const [bone, part, kind] of A_ORDER) {\n    const tint = tints[kind || 'near'];\n    if (curTint && tint !== curTint) batch.flush(tex, curTint);\n    curTint = tint;\n    const p = P[part];\n    const [ox, oy] = p.origin;\n    const [, , w, h] = p.rect;\n    const c = [];\n    for (const [x, y] of [[ox, oy], [ox + w, oy], [ox + w, oy + h], [ox, oy + h]]) {\n      const [mx, my] = apply(M[bone], x, y);\n      c.push(view.x + mx * view.s, view.y + my * view.s);\n    }\n    batch.quad(c, p.rect);\n  }\n  batch.flush(tex, curTint);\n  if (debug) drawBones(batch, rig, M, view);\n}\n\nfunction drawBones(batch, rig, M, view) {\n  const pts = [];\n  const J = rig.J;\n  for (const [name, parent] of Object.entries(HIER)) {\n    if (!parent || name === 'root') continue;\n    const a = apply(M[parent], J[name][0], J[name][1]);\n    const child = Object.keys(HIER).find((k) => HIER[k] === name);\n    const end = child ? apply(M[name], J[child][0], J[child][1]) : apply(M[name], J[name][0] + 20, J[name][1] + 10);\n    pts.push(view.x + a[0] * view.s, view.y + a[1] * view.s, view.x + end[0] * view.s, view.y + end[1] * view.s);\n  }\n  batch.lines(pts, [1, 0.85, 0.2, 1]);\n}\n\n// ---------------------------------------------------------------- B: skinned meshes\nfunction grid(part, P, cols, rows, weightsFn) {\n  const p = P[part];\n  const [ox, oy] = p.origin;\n  const [rx, ry, w, h] = p.rect;\n  const verts = [];\n  for (let j = 0; j <= rows; j++) {\n    for (let i = 0; i <= cols; i++) {\n      const x = ox + (w * i) / cols, y = oy + (h * j) / rows;\n      verts.push({ x, y, u: rx + (w * i) / cols, v: ry + (h * j) / rows, w: weightsFn(x, y) });\n    }\n  }\n  const tris = [];\n  for (let j = 0; j < rows; j++) {\n    for (let i = 0; i < cols; i++) {\n      const k = j * (cols + 1) + i;\n      tris.push(k, k + 1, k + cols + 2, k, k + cols + 2, k + cols + 1);\n    }\n  }\n  return { verts, tris };\n}\n\nexport function buildMeshes(rig) {\n  const P = rig.rig.parts, J = rig.J;\n  const legW = (s) => (x, y) => {\n    const knee = J[`shin${s}`][1], ankle = J[`foot${s}`][1];\n    const wT = 1 - smooth(knee - 18, knee + 18, y);\n    const wF = smooth(ankle - 16, ankle + 4, y);\n    return [[`thigh${s}`, wT], [`shin${s}`, Math.max(0, 1 - wT - wF)], [`foot${s}`, wF]];\n  };\n  const armW = (pre) => (x, y) => {\n    const e = J.armL[1];\n    const wU = 1 - smooth(e - 16, e + 16, y);\n    return [[`${pre}U`, wU], [`${pre}L`, 1 - wU]];\n  };\n  return {\n    legN: grid('legN', P, 6, 36, legW('N')),\n    legF: grid('legF', P, 5, 34, legW('F')),\n    arm: grid('arm', P, 5, 28, armW('arm')),\n    farArm: grid('arm', P, 5, 28, armW('farArm')),\n    torso: grid('torso', P, 8, 18, (x, y) => {\n      const k = smooth(285, 322, y); // hem follows the hips, chest follows the spine\n      return [['torso', 1 - k], ['root', k]];\n    }),\n    head: grid('head', P, 8, 10, (x, y) => {\n      const k = smooth(88, 108, y); // neck blends into the collar\n      return [['head', 1 - k], ['torso', k]];\n    }),\n  };\n}\n\nconst B_ORDER = [['farArm', 'far'], ['legF', 'farLeg'], ['legN'], ['torso'], ['head'], ['arm']];\n\nexport function drawMeshes(batch, tex, rig, meshes, M, pose, view, tints, debug) {\n  const J = rig.J;\n  const out = {};\n  for (const [name, kind] of B_ORDER) {\n    const mesh = meshes[name];\n    const pts = mesh.verts.map((v) => {\n      let { x, y } = v;\n      // pre-skin deformation in rest space: breathing + hair sway + shoulder rise\n      if (name === 'torso') {\n        const chest = smooth(120, 160, y) * (1 - smooth(230, 290, y));\n        x += pose.breath * 2.4 * ((x - J.torso[0]) / 55) * chest;\n        y -= pose.breath * 1.6 * (1 - smooth(110, 200, y));\n      } else if (name === 'arm' || name === 'farArm') {\n        y -= pose.breath * 1.6 * (1 - smooth(150, 240, y));\n      } else if (name === 'head') {\n        const hair = 1 - smooth(10, 70, y);\n        x += pose.sway * 3 * hair * hair;\n        y -= pose.breath * 0.8;\n      }\n      let sx = 0, sy = 0;\n      for (const [bone, w] of v.w) {\n        if (w <= 0) continue;\n        const p = apply(M[bone], x, y);\n        sx += p[0] * w;\n        sy += p[1] * w;\n      }\n      return [view.x + sx * view.s, view.y + sy * view.s];\n    });\n    out[name] = pts;\n    const t = mesh.tris;\n    for (let i = 0; i < t.length; i += 3) {\n      const a = mesh.verts[t[i]], b = mesh.verts[t[i + 1]], c = mesh.verts[t[i + 2]];\n      const pa = pts[t[i]], pb = pts[t[i + 1]], pc = pts[t[i + 2]];\n      batch.tri(pa[0], pa[1], a.u, a.v, pb[0], pb[1], b.u, b.v, pc[0], pc[1], c.u, c.v);\n    }\n    batch.flush(tex, tints[kind || 'near']);\n  }\n  if (debug) {\n    for (const name of ['legN', 'arm', 'torso', 'head']) {\n      const mesh = meshes[name], pts = out[name];\n      const L = [];\n      const t = mesh.tris;\n      for (let i = 0; i < t.length; i += 3) {\n        const a = pts[t[i]], b = pts[t[i + 1]], c = pts[t[i + 2]];\n        L.push(a[0], a[1], b[0], b[1], b[0], b[1], c[0], c[1]);\n      }\n      batch.lines(L, [0.3, 1, 0.9, 0.55]);\n    }\n  }\n}\n\n// ---------------------------------------------------------------- C: AI flipbook\nexport function drawFlipbook(batch, tex, meta, frame, view, opts) {\n  const { w, h } = meta;\n  const draw = (f, alpha) => {\n    const rect = [f * w, 0, w, h];\n    const s = view.s * opts.k;\n    const sy = s * (opts.squash || 1);\n    const x0 = view.x + opts.cx * view.s - (w / 2) * s;\n    const y1 = view.y + opts.ground * view.s;\n    const y0 = y1 - h * sy;\n    batch.quad([x0, y0, x0 + w * s, y0, x0 + w * s, y1, x0, y1], rect);\n    batch.flush(tex, [1, 1, 1, alpha]);\n    if (opts.debug) batch.lines([x0, y0, x0 + w * s, y0, x0 + w * s, y0, x0 + w * s, y1, x0 + w * s, y1, x0, y1, x0, y1, x0, y0], [1, 0.5, 0.3, 0.8]);\n  };\n  const i = Math.floor(frame) % meta.n;\n  if (opts.blend) {\n    const f = frame - Math.floor(frame);\n    draw(i, 1 - f);\n    draw((i + 1) % meta.n, f);\n  } else draw(i, 1);\n}\n\nexport const GAITS = {\n  walk: { name: 'walk', T: 1.1, stance: 0.6, L: 82, lift: 34, drop: 12, arm: 0.32, lean: 0.04 },\n  run: { name: 'run', T: 0.72, stance: 0.36, L: 112, lift: 90, drop: 10, arm: 0.75, lean: 0.16 },\n};\nexport const gaitSpeed = (g) => (2 * g.L) / (g.stance * g.T); // model px / s, stance foot glued to ground\n",
  "walk-frames.json": "{\"w\": 250, \"h\": 380, \"n\": 6, \"frames\": [{\"srcH\": 444, \"neck\": 70, \"scale\": 0.829}, {\"srcH\": 421, \"neck\": 72, \"scale\": 0.806}, {\"srcH\": 444, \"neck\": 69, \"scale\": 0.841}, {\"srcH\": 444, \"neck\": 71, \"scale\": 0.817}, {\"srcH\": 405, \"neck\": 71, \"scale\": 0.817}, {\"srcH\": 445, \"neck\": 71, \"scale\": 0.817}]}"
 },
 "binaryData": {
  "body-atlas.webp": "",
  "face-c.webp": "",
  "face-e.webp": "",
  "face-f.webp": "",
  "face-n.webp": "",
  "walk-frames.webp": ""
 }
}
---
{
 "apiVersion": "apps/v1",
 "kind": "Deployment",
 "metadata": {
  "name": "lifelike",
  "namespace": "demo",
  "labels": {
   "app": "lifelike"
  }
 },
 "spec": {
  "replicas": 1,
  "selector": {
   "matchLabels": {
    "app": "lifelike"
   }
  },
  "template": {
   "metadata": {
    "labels": {
     "app": "lifelike"
    },
    "annotations": {
     "lifelike/site-sha": "2426f901550a038d"
    }
   },
   "spec": {
    "automountServiceAccountToken": false,
    "containers": [
     {
      "name": "nginx",
      "image": "nginx:alpine",
      "ports": [
       {
        "containerPort": 80,
        "name": "http"
       }
      ],
      "resources": {
       "requests": {
        "cpu": "10m",
        "memory": "16Mi"
       },
       "limits": {
        "cpu": "100m",
        "memory": "64Mi"
       }
      },
      "readinessProbe": {
       "httpGet": {
        "path": "/index.html",
        "port": "http"
       },
       "periodSeconds": 10
      },
      "volumeMounts": [
       {
        "name": "site",
        "mountPath": "/usr/share/nginx/html",
        "readOnly": true
       }
      ]
     }
    ],
    "volumes": [
     {
      "name": "site",
      "configMap": {
       "name": "lifelike-site"
      }
     }
    ]
   }
  }
 }
}
---
{
 "apiVersion": "v1",
 "kind": "Service",
 "metadata": {
  "name": "lifelike",
  "namespace": "demo",
  "labels": {
   "app": "lifelike"
  }
 },
 "spec": {
  "type": "ClusterIP",
  "selector": {
   "app": "lifelike"
  },
  "ports": [
   {
    "name": "http",
    "port": 80,
    "targetPort": "http"
   }
  ]
 }
}
---
{
 "apiVersion": "traefik.io/v1alpha1",
 "kind": "Middleware",
 "metadata": {
  "name": "lifelike-slash",
  "namespace": "demo"
 },
 "spec": {
  "redirectRegex": {
   "regex": "^(https?://[^/]+/demo/lifelike)$",
   "replacement": "${1}/",
   "permanent": true
  }
 }
}
---
{
 "apiVersion": "traefik.io/v1alpha1",
 "kind": "Middleware",
 "metadata": {
  "name": "lifelike-strip",
  "namespace": "demo"
 },
 "spec": {
  "stripPrefix": {
   "prefixes": [
    "/demo/lifelike"
   ]
  }
 }
}
---
{
 "apiVersion": "networking.k8s.io/v1",
 "kind": "Ingress",
 "metadata": {
  "name": "lifelike",
  "namespace": "demo",
  "annotations": {
   "traefik.ingress.kubernetes.io/router.middlewares": "demo-lifelike-slash@kubernetescrd,demo-lifelike-strip@kubernetescrd"
  }
 },
 "spec": {
  "ingressClassName": "traefik",
  "rules": [
   {
    "host": "EXAMPLE_HOST",
    "http": {
     "paths": [
      {
       "path": "/demo/lifelike",
       "pathType": "Prefix",
       "backend": {
        "service": {
         "name": "lifelike",
         "port": {
          "number": 80
         }
        }
       }
      }
     ]
    }
   }
  ]
 }
}
