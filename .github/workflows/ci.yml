# Tests + lint for pull requests and master. No secrets; read-only token.
name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        # Run tests even when lint fails, so one run reports both.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
