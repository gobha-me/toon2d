# /demo/toon -> 301 /demo/toon/ (relative module paths need the slash), then strip /demo/toon.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: toon-slash
  namespace: demo
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/demo/toon)$
    replacement: ${1}/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: toon-strip
  namespace: demo
spec:
  stripPrefix:
    prefixes:
      - /demo/toon
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: demo-toon-slash@kubernetescrd,demo-toon-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: EXAMPLE_HOST
      http:
        paths:
          - path: /demo/toon
            pathType: Prefix
            backend:
              service:
                name: demo
                port:
                  number: 80
